# Release builds on GitHub Actions (GitHub-hosted runners). See docs/releasing.md for how to cut a release
# and the optional signing secrets.
#
# A pushed tag vX.Y.Z builds every package and publishes a GitHub release with them and SHA256SUMS.
# Run by hand it builds artifacts only, unless release_tag explicitly selects an existing tag to publish.
#
# Jobs: version check, Linux x86_64/aarch64 (tar.gz, deb, rpm, AppImage), Windows x86_64
# (MSI + zip), universal macOS (DMG), and publish only after all three platforms succeed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (empty builds artifacts only)'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  # Toolchain for the jobs that do not run in the rust:1.99-bookworm image; keep the two in step.
  RUST_TOOLCHAIN: "1.99"

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Validate version and release notes
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          source packaging/env.sh
          v="$MC_VERSION"
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" && "$tag" != "v$v" ]]; then
            echo "Tag must match workspace version v$v" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          test -f "docs/releases/$v.md"
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"
          echo "MailCraft $v (prerelease: $pre)"

  linux:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    # Both architectures build natively, so ci-deps.sh installs no cross compiler.
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.99-bookworm
    env:
      MC_REQUIRE_NFPM: "1"
      MC_DOWNLOAD_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Trust the checkout (container user differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache cargo and packaging tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.cache/mailcraft-packaging
            target
          key: release-linux-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Packaging tools (apt, nfpm)
        run: |
          packaging/linux/ci-deps.sh "${{ matrix.target }}"
          rustup target add "${{ matrix.target }}"
      - name: Build, tar.gz, deb, rpm
        run: packaging/linux/package.sh --build --target "${{ matrix.target }}" --out dist
      - name: AppImage
        run: packaging/linux/appimage.sh --target "${{ matrix.target }}" --out dist
      - name: Binary smoke checks
        run: |
          "target/${{ matrix.target }}/release/mailcraft" --version
          "target/${{ matrix.target }}/release/mailcraft-cli" --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  windows:
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          rustup default $env:RUST_TOOLCHAIN
      - name: Build, sign (when the certificate secrets exist), MSI and zip
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Target x86_64-pc-windows-msvc -OutDir dist
      - name: Binary smoke checks
        shell: pwsh
        run: |
          foreach ($name in @("mailcraft.exe", "mailcraft-cli.exe")) {
            $exe = (Resolve-Path "target/x86_64-pc-windows-msvc/release/$name").Path
            $process = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "$name smoke check failed with exit $($process.ExitCode)" }
          }
      - name: Icon resource and MSI shortcut icon
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          ./packaging/windows/check-icon.ps1 -Exe target/x86_64-pc-windows-msvc/release/mailcraft.exe -Msi $msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    needs: version-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - name: Universal app, sign and notarise (when the Apple secrets exist), DMG
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/package.sh --out dist
      - name: Universal binary smoke checks
        run: |
          target/packaging/macos/MailCraft.app/Contents/MacOS/mailcraft --version
          target/packaging/macos/MailCraft.app/Contents/MacOS/mailcraft-cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version-check, linux, windows, macos]
    # Tag pushes only; every requested platform must succeed.
    if: >-
      ${{ !cancelled() && needs.version-check.outputs.tag != ''
      && needs.version-check.result == 'success' && needs.linux.result == 'success'
      && needs.windows.result == 'success' && needs.macos.result == 'success'
      && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Collect the packages and write SHA256SUMS
        run: |
          mkdir -p dist/release
          find dist/artifacts -type f -exec cp {} dist/release/ \;
          cd dist/release
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          cp "docs/releases/$VERSION.md" dist/notes.md
          cat dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version-check.outputs.tag }}
          VERSION: ${{ needs.version-check.outputs.version }}
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the files of the existing release.
            gh release upload "$TAG" dist/release/* --clobber
          else
            flags=(--verify-tag --title "MailCraft $VERSION" --notes-file dist/notes.md)
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/release/*
          fi
