<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Original MailCraft Mac artwork: a porcelain tile and a folded slate-blue envelope. MIT OR Apache-2.0. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#FCFDFF"/><stop offset="1" stop-color="#DFE6EF"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#7895B5"/><stop offset="1" stop-color="#465F7C"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F9FBFE"/><stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#253C57" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="101" fill="url(#tile)" stroke="#FFFFFF" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="106" y="160" width="300" height="208" rx="26" fill="url(#paper)"/>
    <path d="M110 344 L223 254 Q256 230 289 254 L402 344" fill="none" stroke="#A8BED5" stroke-width="2" opacity="0.6"/>
    <path d="M132 160 H380 Q406 160 406 186 L276 278 Q256 292 236 278 L106 186 Q106 160 132 160Z" fill="url(#flap)"/>
    <path d="M108 187 L236 278 Q256 292 276 278 L404 187" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75"/>
  </g>
</svg>
